[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.22.0"
  BUN_VERSION = "1.4.2"
  BUN_FLAGS = "--frozen-lockfile"

# Let React Router handle page URLs without replacing real static assets.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
